{% assign alumni = site.members | where: "group", "alum" | sort: "name" %}

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Where they are now</th>
    </tr>
  </thead>
  <tbody>
    {% for alumnus in alumni %}
      <tr>
        <td>
          <a class="alumni-person" href="{{ alumnus.url | relative_url }}">
            <img
              class="alumni-image"
              src="{{ alumnus.image | relative_url }}"
              alt="Portrait of {{ alumnus.name }}"
              loading="lazy"
              {% include fallback.html %}
            >
            <span>{{ alumnus.name }}</span>
          </a>
        </td>
        <td>{{ alumnus.current_position | default: "—" }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>

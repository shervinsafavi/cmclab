- id: doi:10.1101/2023.02.14.528465
  title: Signatures of criticality in efficient coding networks
  authors:
  - Shervin Safavi
  - Matthew Chalk
  - Nikos Logothetis
  - Anna Levina
  publisher: openRxiv
  date: '2023-02-14'
  link: https://doi.org/gswshp
  type: preprint
  description: In this study, we probe the connection between the optimality discussed
    in the context of criticality hypothesis of the brain (that very much tied to
    neural dynamics), and the optimality discussed in theories of neural computations.
    We examine an efficient coding network for signatures of criticality and we find
    signatures of criticality emerging in a network that was designed based on criticality-agnostic
    principles merely by optimizing the coding performance. This suggests criticality
    and efficient coding might be intimately related.
